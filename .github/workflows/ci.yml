name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest
    name: ubuntu-latest / clang-format

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Pinned: other clang-format versions can format the same code differently.
      - name: Install
        run: python -m pip install clang-format==23.1.3

      - name: Check
        run: git ls-files -z "*.c" "*.h" "*.cpp" "*.hpp" "*.inc" | xargs -0 clang-format --dry-run -Werror

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
          - os: macos-latest
            compiler: clang
            cc: clang
            cxx: clang++
          - os: windows-latest
            compiler: msvc
            cc: cl
            cxx: cl

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / ${{ matrix.compiler }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Clang (Linux)
        if: matrix.os == 'ubuntu-latest' && matrix.compiler == 'clang'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Configure (Unix)
        if: matrix.os != 'windows-latest'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -B build -DEPAPER_IMAGE_BUILD_TESTS=ON -DEPAPER_IMAGE_BUILD_TOOLS=ON -DEPAPER_IMAGE_WARNINGS_AS_ERRORS=ON

      - name: Configure (Windows)
        if: matrix.os == 'windows-latest'
        run: cmake -B build -DEPAPER_IMAGE_BUILD_TESTS=ON -DEPAPER_IMAGE_BUILD_TOOLS=ON -DEPAPER_IMAGE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test (Unix)
        if: matrix.os != 'windows-latest'
        run: ctest --test-dir build --output-on-failure

      - name: Test (Windows)
        if: matrix.os == 'windows-latest'
        run: ctest --test-dir build -C Release --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    name: ubuntu-latest / sanitizers (${{ matrix.build_type }})
    strategy:
      fail-fast: false
      matrix:
        # Release is included so the NDEBUG rejection branches run.
        build_type: [Debug, Release]
    env:
      CC: clang
      CXX: clang++
      SAN_FLAGS: -fsanitize=address,undefined,float-divide-by-zero -fno-sanitize-recover=undefined -fno-omit-frame-pointer

    steps:
      - uses: actions/checkout@v5

      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DEPAPER_IMAGE_BUILD_TESTS=ON
          -DEPAPER_IMAGE_BUILD_TOOLS=ON
          -DEPAPER_IMAGE_WARNINGS_AS_ERRORS=ON
          -DEPAPER_IMAGE_BUILD_FUZZ=ON
          -DCMAKE_C_FLAGS="$SAN_FLAGS"
          -DCMAKE_CXX_FLAGS="$SAN_FLAGS"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  emscripten:
    runs-on: ubuntu-latest
    name: ubuntu-latest / emscripten

    steps:
      - uses: actions/checkout@v5

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Configure
        run: emcmake cmake -B build-wasm -DEPAPER_IMAGE_BUILD_TESTS=ON -DEPAPER_IMAGE_BUILD_TOOLS=OFF -DEPAPER_IMAGE_WARNINGS_AS_ERRORS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-wasm

      # Runs under Node; the fingerprint and golden tests check that WASM
      # output is byte-identical to the native builds (design.md "Fixed-point arithmetic and determinism").
      - name: Test
        run: ctest --test-dir build-wasm --output-on-failure

  panelgen:
    # macOS: the committed tables were generated there, and --check fails on
    # other platforms (tools/panelgen/README.md).
    runs-on: macos-latest
    name: macos-latest / panelgen

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: python -m pip install -r tools/panelgen/requirements.txt

      # The generated tables must match their generator.
      - name: panelgen --check
        working-directory: tools/panelgen
        run: |
          python -m panelgen --check
          python -m panelgen gdey075t7 --check

      - name: panelgen tests
        working-directory: tools/panelgen
        run: python -m pytest -q

  panel:
    runs-on: ubuntu-latest
    name: ubuntu-latest / panel

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: python -m pip install -r tools/panel/requirements.txt

      - name: panel tests
        working-directory: tools/panel
        run: python -m pytest -q tests
