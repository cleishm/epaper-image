version: "0.2.0"
description: "Image conversion for e-paper panels: streaming resampling, tone adjustment, palette matching and error diffusion"
url: "https://github.com/cleishm/epaper-image"
repository: "https://github.com/cleishm/epaper-image.git"
license: "MIT"
files:
  exclude:
    - "tools/**/*"
